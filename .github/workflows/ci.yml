name: Synthetic validation

on:
  push:
    branches: [feat/phase0-bootstrap, feat/phase1-geometry-foundation, feat/phase2-constraint-engine, feat/phase3-massing-candidate-foundation, feat/phase4-search-ranking-foundation, feat/phase5-web-results-viewer, feat/phase7-results-interpretation, feat/phase8-local-run-package, feat/phase9-run-package-viewer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python Core and Run Package (synthetic only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest --tb=no
      - name: Validate synthetic sample (summary only)
        run: python -m bve cases/example-urban-office/project.json
      - name: Validate synthetic geometry (codes only; no output artifacts)
        run: |
          python -m bve.geometry cases/example-urban-office/site.geojson --format geojson
          python -m bve.geometry cases/example-urban-office/site.dxf --format dxf --layer SITE
      - name: Validate synthetic constraints (counts only; temporary geometry)
        run: |
          geometry_file="$RUNNER_TEMP/sdg-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.geojson"
          python -m bve.geometry cases/example-urban-office/site.geojson --format geojson --output "$geometry_file"
          python -m bve.constraints --project cases/example-urban-office/project.json --geometry "$geometry_file" --area-basis declared_project_area
          python -m bve.constraints --project cases/example-urban-office/project.json --geometry "$geometry_file" --area-basis geometry_area
      - name: Validate synthetic massing and search (summary only; temporary inputs)
        run: |
          geometry_file="$RUNNER_TEMP/sdg-massing-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.geojson"
          constraint_file="$RUNNER_TEMP/sdg-massing-caps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          python -m bve.geometry cases/example-urban-office/site.geojson --format geojson --output "$geometry_file"
          python -m bve.constraints --project cases/example-urban-office/project.json --geometry "$geometry_file" --area-basis declared_project_area --output "$constraint_file"
          python -m bve.massing --geometry "$geometry_file" --constraints "$constraint_file" --floor-height-m 4
          python -m bve.search --geometry "$geometry_file" --constraints "$constraint_file" --floor-height-m 4 --floor-height-m 5 --floor-height-m 6 --floor-height-m 7 --floor-height-m 8
          python -m bve.search --geometry "$geometry_file" --constraints "$constraint_file" --floor-height-m 4 --floor-height-m 32
          python -m bve.search --geometry "$geometry_file" --constraints "$constraint_file" --floor-height-m 32 --floor-height-m 40
      - name: Run Package create and verify (summary only; runner temp; no upload)
        run: |
          package="$RUNNER_TEMP/sdg-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m bve.run create --project cases/example-urban-office/project.json --geometry cases/example-urban-office/site.geojson --format geojson --area-basis declared_project_area --floor-height-m 4 --floor-height-m 5 --floor-height-m 6 --floor-height-m 7 --floor-height-m 8 --output "$package"
          python -m bve.run verify --package "$package"
          dxf_package="$RUNNER_TEMP/sdg-dxf-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m bve.run create --project cases/example-urban-office/project.json --geometry cases/example-urban-office/site.dxf --format dxf --layer SITE --area-basis geometry_area --floor-height-m 4 --floor-height-m 40 --output "$dxf_package"
          python -m bve.run verify --package "$dxf_package"

  web:
    name: Web and public boundary (synthetic only)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Existing Python Core for public synthetic package test preparation only
        run: python -m pip install -e .
      - run: npm ci
      - run: npm run check:boundary
      - run: npm run lint
      - name: Web tests (no assertion payloads in CI log)
        run: npm run test:ci --workspace @sdg/web
      - name: Search resource regressions (128 MiB heap; summary only)
        run: |
          node --max-old-space-size=128 --experimental-strip-types apps/web/tests/search-resource-probe.ts wide4
          node --max-old-space-size=128 --experimental-strip-types apps/web/tests/search-resource-probe.ts wide6
          node --max-old-space-size=128 --experimental-strip-types apps/web/tests/search-resource-probe.ts wide8
          node --max-old-space-size=128 --experimental-strip-types apps/web/tests/search-resource-probe.ts deep6
      - run: npm run build
